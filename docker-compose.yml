version: '3.8'

services:
  fast-calendar-mcp:
    build: .
    container_name: fast-calendar-mcp
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 5)"]
      interval: 30s
      timeout: 10s
      retries: 3
